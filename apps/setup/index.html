<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../../brand/logo.svg" type="image/svg+xml" />
    <title>企业品牌配置</title>
  </head>
  <body>
    <main class="workspace">
      <header><p>员工培训平台</p><h1>企业品牌配置</h1></header>
      <div class="layout">
        <form id="brand-form">
          <label for="company-name">企业名称（选填）</label>
          <input id="company-name" maxlength="40" autocomplete="organization" />

          <label for="logo-file">企业 Logo</label>
          <input id="logo-file" type="file" accept="image/png,image/jpeg,image/webp" />
          <p class="field-note" id="file-note">PNG、JPEG 或 WebP，最大 2 MB</p>

          <fieldset>
            <legend>企业色卡</legend>
            <div id="palette" class="palette"></div>
          </fieldset>

          <p id="status" role="status" aria-live="polite"></p>
          <button class="export" type="submit">导出品牌配置</button>
        </form>
        <section aria-labelledby="preview-title">
          <h2 id="preview-title">效果预览</h2>
          <div class="previews">
            <article class="preview">
              <header><img data-logo alt="" /><strong data-company></strong></header>
              <div class="sample">
                <span class="tag">产品培训</span>
                <h3>新员工入门</h3>
                <progress value="66" max="100" aria-label="学习进度"></progress>
                <span class="sample-action">继续学习</span>
              </div>
            </article>
            <article class="preview">
              <header><img data-logo alt="" /><strong data-company></strong></header>
              <div class="sample">
                <span class="tag">管理后台</span>
                <h3>课程管理</h3>
                <p class="sample-row">新员工入门 <span>已发布</span></p>
              </div>
            </article>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
